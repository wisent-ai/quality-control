# Turn a merged version bump into the tag that publishes it.
#
# The failure this removes was measured, not imagined. Work merged to a
# product's `main` and then sat there: skarbiec's newest release was v0.1.3
# from 1 August, while `main` carried commands that reached no machine at all,
# because publication hangs on a tag nobody typed. Every downstream question -
# "why does the fleet not have this", "why does the host say the binary
# predates the command" - traced back to that one unperformed keystroke.
#
# The decision does not move. `ci.yml` in skarbiec puts it exactly right:
# "Naming the number is mechanical; deciding to release is not." Bumping the
# version in the manifest IS the decision, it is made by a person, and it
# arrives through a reviewed pull request. What this automates is the
# keystroke afterwards.
#
# Three refusals keep it honest:
#   - it never invents a number, it reads the manifest;
#   - it never moves or replaces an existing tag, so a published coordinate
#     stays immutable;
#   - it does nothing at all when the manifest version is unchanged, which is
#     the ordinary case for most merges.

name: tag on manifest bump

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the Cargo.toml whose version is the product's.
        type: string
        default: Cargo.toml
      runs-on:
        type: string
        default: ubuntu-latest
      release-workflow:
        description: Workflow to dispatch on the version tag; empty means tag only.
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || format('"{0}"', inputs.runs-on)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags have to be visible, or "does this tag exist" is answered by an
          # incomplete clone and the workflow re-tags something already
          # published.
          fetch-depth: 0

      - name: Tag the declared version, once
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' "$MANIFEST" | head -1)"
          if [ -z "$declared" ]; then
            echo "::error::$MANIFEST declares no version, so there is no number to tag."
            exit 1
          fi
          tag="v$declared"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf '%s\n' "$tag already exists; the manifest names a version that is" \
              "already published or already queued. Nothing to do."
            exit 0
          fi
          # An annotated tag, so the object records who produced it and why.
          # A published coordinate is permanent; it should say where it came
          # from without anyone having to guess from the commit it points at.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$declared, from the version declared in $MANIFEST at ${GITHUB_SHA}"
          git push origin "$tag"
          printf '%s\n' "tagged $tag"

      - name: Dispatch the release workflow
        if: inputs.release-workflow != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.manifest }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' "$MANIFEST" | head -1)"
          test -n "$declared"
          tag="v$declared"
          active_or_complete="$(
            gh run list \
              --workflow "$RELEASE_WORKFLOW" \
              --branch "$tag" \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] | select(.status != "completed" or .conclusion == "success") | .databaseId'
          )"
          if [ -n "$active_or_complete" ]; then
            printf '%s\n' "$RELEASE_WORKFLOW already has an active or successful run for $tag."
            exit 0
          fi
          gh workflow run "$RELEASE_WORKFLOW" --ref "$tag"
          printf '%s\n' "dispatched $RELEASE_WORKFLOW at $tag"
