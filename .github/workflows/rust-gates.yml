# The gates every Rust repository runs, in one place: rustfmt's form over the
# whole tree, clippy with warnings denied, and a locked release build. A
# repository calls this workflow by a pinned revision instead of carrying a
# gate set of its own, so a gate changed here reaches each caller when that
# caller moves its pin.
#
# The gates are FIXED. There is no input to skip fmt, relax clippy, or pick a
# different build profile, because an input like that is how a repository
# quietly opts out of the standard while still appearing to call it. A
# repository that cannot pass these has a defect to fix, not a flag to set.

name: rust gates

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label, or a JSON list of labels. Defaults to GitHub-hosted
          Linux; pass a self-hosted label set where the account's hosted
          minutes matter.
        type: string
        default: ubuntu-latest
      toolchain:
        description: Rust toolchain the gates run under.
        type: string
        default: stable
      working-directory:
        description: >-
          Directory holding Cargo.toml, for repositories whose crate is not at
          the root.
        type: string
        default: .
      format-command:
        description: >-
          The command that checks formatting, run in working-directory. A
          repository whose release declares its own format gate (one that
          reaches files `cargo fmt` does not, such as modules declared through
          a macro) passes that gate here, so CI refuses what its release
          refuses.
        type: string
        default: cargo fmt --all --check
    secrets:
      repository_token:
        description: Token used only when Cargo must read a private Git dependency.
        required: false

permissions:
  contents: read

jobs:
  gates:
    # A JSON list of labels is read as a list; any other value is one label.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    # A superseded pull request that keeps compiling holds a runner nobody is
    # waiting on. Only pull requests cancel: a push to main may be the source
    # revision an immutable release is already waiting for, which is the
    # reason version-check.yml groups by SHA.
    concurrency:
      group: rust-gates-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Incremental compilation is off because the toolchain action below sets
    # CARGO_INCREMENTAL to off for later steps whenever the runner has not
    # set it; the action is pinned to one revision, so that step cannot change
    # under the gates, and a runner whose own environment sets it decides.
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure private Git dependency access
        env:
          REPOSITORY_TOKEN: ${{ secrets.repository_token }}
        run: |
          if [ -n "$REPOSITORY_TOKEN" ]; then
            git config --global \
              url."https://x-access-token:${REPOSITORY_TOKEN}@github.com/".insteadOf \
              https://github.com/
            printf '%s\n' 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
          fi

      # The toolchain action below runs rustup's installer when rustup is not
      # on the PATH, and on Unix that installer writes the account's shell
      # profile, which a self-hosted runner account may not own. A runner's
      # steps run without reading that profile, so a rustup installed the usual
      # way can sit in Cargo's bin directory while the PATH does not name it.
      # This step names that directory to later steps when it holds rustup,
      # and installs rustup there with --no-modify-path only when neither the
      # PATH nor that directory has one. On Windows the action's own installer
      # already passes --no-modify-path, so the step leaves Windows to it.
      - name: Find or install rustup without changing the runner's shell profile
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if ! command -v rustup >/dev/null; then
            if [ ! -x "$bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail https://sh.rustup.rs \
                | sh -s -- -y --no-modify-path --default-toolchain none
            fi
            printf '%s\n' "$bin" >> "$GITHUB_PATH"
          fi

      # Pinned to one revision of its stable branch: the gates rely on its
      # rustup check and its incremental step, which a moving branch could
      # change without a commit here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      # The gates compile the same dependency graph twice — clippy in the dev
      # profile, then the release build — and before this step they compiled it
      # from zero on every run, because the target directory lived inside the
      # workspace `actions/checkout` refreshes. Keeping it beside the runner,
      # keyed by repository and toolchain, means a pull request recompiles what
      # the commit changed instead of the whole graph. A hosted runner gets a
      # fresh machine anyway, so there it costs one `mkdir`.
      - name: Share the builder's compiled dependencies
        run: |
          root="$HOME/.cache/wisent-rust-gates/${GITHUB_REPOSITORY##*/}/${{ inputs.toolchain }}"
          mkdir -p "$root"
          printf '%s\n' "CARGO_TARGET_DIR=$root" >> "$GITHUB_ENV"

      # Formatting first, and it is the whole tree rather than the crate the
      # build happens to touch: a formatter nobody ran on new files is exactly
      # what this gate is for. A caller that declares its own format gate
      # names it in format-command.
      - name: Format check
        run: ${{ inputs.format-command }}

      # Warnings are errors. A warning nobody is forced to read is a warning
      # nobody reads.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # --locked: the lockfile in the commit is the lockfile that is built. A
      # build that may silently resolve a different dependency set is not
      # evidence about the commit under test.
      - name: cargo build
        run: cargo build --locked --release
