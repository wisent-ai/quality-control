# The gates every Rust repository in the pack runs, in one place.
#
# Measured before this existed: four Rust repositories with CI, four different
# gate sets. skarbiec ran `cargo fmt --check` and `clippy --all-targets`,
# image-video-router ran `fmt --all -- --check` and `clippy --all-targets
# --all-features`, brama built and checked nothing, and jeden ran
# `cargo check` with neither fmt nor clippy. Across the whole pack there were
# 111 workflow files, which is 111 places for a gate to drift, and the fix
# applied to one of them protected exactly one repository.
#
# The desktop side already proved the alternative: nine applications share a
# single reusable release workflow and each carries a fourteen-line caller.
# This is the same shape for the gate side.
#
# The gates are FIXED. There is no input to skip fmt, relax clippy, or pick a
# different build profile, because an input like that is how a repository
# quietly opts out of the standard while still appearing to call it. A
# repository that cannot pass these has a defect to fix, not a flag to set.

name: rust gates

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label set. Defaults to GitHub-hosted Linux; pass a
          self-hosted label where the account's hosted minutes matter, which
          on this fleet they do.
        type: string
        default: ubuntu-latest
      toolchain:
        description: Rust toolchain the gates run under.
        type: string
        default: stable
      working-directory:
        description: >-
          Directory holding Cargo.toml, for repositories whose crate is not at
          the root.
        type: string
        default: .
    secrets:
      repository_token:
        description: Token used only when Cargo must read a private Git dependency.
        required: false

permissions:
  contents: read

jobs:
  gates:
    runs-on: ${{ fromJSON(startsWith(inputs.runs-on, '[') && inputs.runs-on || format('"{0}"', inputs.runs-on)) }}
    # A superseded pull request that keeps compiling holds a self-hosted
    # runner nobody is waiting on. Only pull requests cancel: a push to main
    # may be the source revision an immutable release is already waiting for,
    # which is the reason version-check.yml groups by SHA.
    concurrency:
      group: rust-gates-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Without this a wedged gate holds a runner for GitHub's six-hour default.
    # The slowest repository in the pack is Stado, whose crate carries 16 MB of
    # source, six binaries and fourteen test targets; 45 minutes is above its
    # cold build and far below the default.
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Incremental artifacts are worthless to a job that never runs twice in
      # one workspace, and they are what makes a target directory grow without
      # bound. jeden's own ci.yml has set this since it was written.
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure private Git dependency access
        env:
          REPOSITORY_TOKEN: ${{ secrets.repository_token }}
        run: |
          [ -z "$REPOSITORY_TOKEN" ] && exit 0
          git config --global \
            url."https://x-access-token:${REPOSITORY_TOKEN}@github.com/".insteadOf \
            https://github.com/
          printf '%s\n' 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      # The gates compile the same dependency graph twice — clippy in the dev
      # profile, then the release build — and before this step they compiled it
      # from zero on every run, because the target directory lived inside the
      # workspace `actions/checkout` refreshes. Keeping it beside the runner,
      # keyed by repository and toolchain, means a pull request recompiles what
      # the commit changed instead of the whole graph. A hosted runner gets a
      # fresh machine anyway, so there it costs one `mkdir`.
      - name: Share the builder's compiled dependencies
        run: |
          root="$HOME/.cache/wisent-rust-gates/${GITHUB_REPOSITORY##*/}/${{ inputs.toolchain }}"
          mkdir -p "$root"
          printf '%s\n' "CARGO_TARGET_DIR=$root" >> "$GITHUB_ENV"

      # Formatting first, and it is the whole tree rather than the crate the
      # build happens to touch. This gate refused five merges in one evening
      # on skarbiec, each one red on main, because the formatter had not been
      # run on new files - which is exactly what it is for.
      - name: cargo fmt
        run: cargo fmt --all --check

      # Warnings are errors. A warning nobody is forced to read is a warning
      # nobody reads.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # --locked: the lockfile in the commit is the lockfile that is built. A
      # build that may silently resolve a different dependency set is not
      # evidence about the commit under test.
      - name: cargo build
        run: cargo build --locked --release
