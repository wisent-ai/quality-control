name: Organization release policy

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/release-policy-audit.yml
      - scripts/release-policy.sh

permissions:
  contents: read

concurrency:
  group: organization-release-policy
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QUALITY_CONTROL_ORG_AUDIT_TOKEN: ${{ secrets.QUALITY_CONTROL_ORG_AUDIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse silent, malformed, or partially enumerated release policy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$QUALITY_CONTROL_ORG_AUDIT_TOKEN" ]; then
            echo "::error::QUALITY_CONTROL_ORG_AUDIT_TOKEN must read metadata and contents for every wisent-ai repository."
            false
          fi
          scripts/release-policy.sh --github-org wisent-ai --json
