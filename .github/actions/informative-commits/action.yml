name: Informative commit messages
description: Fails a pull request when commit messages are too vague to audit later.
inputs:
  github-token:
    description: GitHub token used to read pull request commits.
    required: true
  min-informative-words:
    description: Minimum number of distinct words in each commit subject. Empty means the rule is not applied.
    required: false
  min-subject-characters:
    description: Minimum length of each commit subject in characters. Empty means the rule is not applied.
    required: false
  min-subject-words:
    description: Minimum number of words in a subject without a Conventional Commit prefix. Empty means the rule is not applied.
    required: false
  min-word-characters:
    description: Length from which a word counts as specific; a subject needs one such word or an identifier. Empty means the rule is not applied.
    required: false
runs:
  using: composite
  steps:
    - name: Check commit messages
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MIN_INFORMATIVE_WORDS: ${{ inputs.min-informative-words }}
        MIN_SUBJECT_CHARACTERS: ${{ inputs.min-subject-characters }}
        MIN_SUBJECT_WORDS: ${{ inputs.min-subject-words }}
        MIN_WORD_CHARACTERS: ${{ inputs.min-word-characters }}
      run: node "$GITHUB_ACTION_PATH/check-informative-commits.mjs"
